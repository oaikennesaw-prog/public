<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Document Fragments Quiz</title>
  <style>
    :root{
      --bg:#0b1220;
      --panel:#111b33;
      --panel2:#0f1930;
      --text:#f5f7ff;
      --muted:#c6cde6;
      --border:#3a4a7a;
      --accent:#7aa2ff;
      --good:#2fbf8f;
      --bad:#e36d6d;
      --focus:#9bd0ff;
      --shadow: 0 12px 32px rgba(0,0,0,.35);
      --radius: 16px;
      --radius2: 12px;
      --max: 980px;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      background: radial-gradient(1200px 700px at 15% 10%, rgba(122,162,255,.18), transparent 55%),
                  radial-gradient(900px 600px at 85% 15%, rgba(47,191,143,.12), transparent 55%),
                  radial-gradient(900px 600px at 80% 90%, rgba(227,109,109,.10), transparent 55%),
                  var(--bg);
      color: var(--text);
      line-height:1.5;
    }

    a{ color:var(--accent); }
    .skip-link{
      position:absolute; left:-999px; top:auto; width:1px; height:1px; overflow:hidden;
    }
    .skip-link:focus{
      left:16px; top:16px; width:auto; height:auto; padding:10px 12px;
      background: var(--panel); border: 2px solid var(--focus); border-radius: 10px;
      z-index: 9999;
    }

    header{
      padding: 32px 16px 8px;
    }
    .wrap{ max-width: var(--max); margin: 0 auto; }
    .title{
      display:flex; gap:14px; align-items:flex-start; justify-content:space-between; flex-wrap:wrap;
    }
    h1{
      margin:0;
      font-size: clamp(1.35rem, 2.2vw, 2rem);
      letter-spacing:.2px;
    }
    .subtitle{
      margin: 10px 0 0;
      color: var(--muted);
      max-width: 70ch;
    }

    main{ padding: 16px 16px 48px; }
    .card{
      background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
      border: 1px solid rgba(58,74,122,.7);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .card + .card{ margin-top: 16px; }

    .qTop{
      display:flex;
      align-items:flex-start;
      gap: 14px;
      padding: 18px 18px 10px;
      border-bottom: 1px solid rgba(58,74,122,.45);
      background: rgba(17,27,51,.35);
    }
    .qNum{
      flex:0 0 auto;
      width: 40px;
      height: 40px;
      border-radius: 999px;
      background: rgba(122,162,255,.14);
      border: 1px solid rgba(122,162,255,.55);
      display:grid;
      place-items:center;
      font-weight: 700;
      color: var(--text);
      user-select:none;
    }
    .qHead{ flex: 1 1 auto; }
    .qHead h2{
      margin: 0;
      font-size: 1.08rem;
      letter-spacing:.15px;
    }
    .qMeta{
      margin-top: 6px;
      color: var(--muted);
      font-size: .95rem;
    }

    .qBody{
      padding: 16px 18px 18px;
      background: rgba(17,27,51,.2);
    }

    fieldset{
      border: 0;
      padding: 0;
      margin: 0;
      min-inline-size: 0;
    }
    legend{
      font-weight: 650;
      margin-bottom: 10px;
      padding: 0;
    }

    .options{
      display:grid;
      gap: 10px;
      margin: 8px 0 0;
    }
    .opt{
      display:flex;
      gap: 10px;
      align-items:flex-start;
      padding: 12px 12px;
      border-radius: var(--radius2);
      border: 1px solid rgba(58,74,122,.55);
      background: rgba(15,25,48,.55);
      transition: transform .08s ease, border-color .12s ease, background .12s ease;
    }
    .opt:hover{
      border-color: rgba(122,162,255,.65);
      background: rgba(15,25,48,.75);
      transform: translateY(-1px);
    }

    /* Native controls: keep them native for WCAG; just size and accent */
    input[type="radio"],
    input[type="checkbox"]{
      margin-top: 2px;
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      flex: 0 0 auto;
    }

    .opt label{
      cursor:pointer;
      display:block;
      width:100%;
    }
    .optText{
      display:block;
      font-size: 1rem;
    }

    .controls{
      display:flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items:center;
      margin-top: 14px;
    }

    button{
      appearance:none;
      border: 1px solid rgba(122,162,255,.65);
      background: rgba(122,162,255,.14);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 12px;
      font-weight: 650;
      letter-spacing:.15px;
      cursor: pointer;
      transition: transform .08s ease, background .12s ease, border-color .12s ease;
    }
    button:hover{
      background: rgba(122,162,255,.20);
      border-color: rgba(122,162,255,.9);
      transform: translateY(-1px);
    }
    button:disabled{
      opacity: .55;
      cursor: not-allowed;
      transform:none;
    }
    .btnSecondary{
      border-color: rgba(198,205,230,.5);
      background: rgba(198,205,230,.08);
    }
    .btnSecondary:hover{
      border-color: rgba(198,205,230,.8);
      background: rgba(198,205,230,.12);
    }

    .feedback{
      margin-top: 14px;
      padding: 12px 12px;
      border-radius: 12px;
      border: 1px solid rgba(58,74,122,.55);
      background: rgba(15,25,48,.55);
    }
    .feedback[hidden]{ display:none; }
    .feedback strong{ display:inline-block; margin-right: 6px; }
    .feedback.good{
      border-color: rgba(47,191,143,.65);
      background: rgba(47,191,143,.10);
    }
    .feedback.bad{
      border-color: rgba(227,109,109,.65);
      background: rgba(227,109,109,.10);
    }

    .reveals{
      margin-top: 12px;
      border-radius: 12px;
      border: 1px dashed rgba(198,205,230,.55);
      background: rgba(255,255,255,.03);
      padding: 10px 12px;
    }
    .reveals h3{
      margin: 0 0 6px;
      font-size: .98rem;
      color: var(--muted);
      font-weight: 700;
    }
    .revealList{
      margin: 0;
      padding-left: 18px;
      display:grid;
      gap: 6px;
      color: var(--text);
    }
    .revealList li{
      color: var(--text);
    }
    .hintNote{
      margin-top: 10px;
      color: var(--muted);
      font-size: .93rem;
    }

    /* Focus visibility (WCAG) */
    :focus{ outline:none; }
    :focus-visible{
      outline: 3px solid var(--focus);
      outline-offset: 3px;
      border-radius: 10px;
    }

    /* Reduce motion preference */
    @media (prefers-reduced-motion: reduce){
      *{ transition:none !important; scroll-behavior:auto !important; }
      .opt:hover{ transform:none; }
      button:hover{ transform:none; }
    }
  </style>
</head>

<body>
  <a class="skip-link" href="#main">Skip to quiz</a>

  <header>
    <div class="wrap">
      <div class="title">
        <div>
          <h1>Document Fragments Quiz</h1>
          <p class="subtitle">
            Answer each question, then use “Check answer” to get feedback. Use “Show next clue” for progressive reveals.
            (WCAG 2.0-friendly: keyboard navigable, screen-reader readable, and not color-dependent.)
          </p>
        </div>
      </div>
    </div>
  </header>

  <main id="main" class="wrap" aria-label="Quiz">
    <!-- Questions render here -->
    <div id="quiz"></div>
  </main>

  <script>
    const quizData = [
      {
        id: "q1",
        number: 1,
        title: "Who was the intended audience?",
        type: "single",
        correct: ["delegates"],
        options: [
          { value: "delegates", text: "Delegates of the states in Congress assembled" },
          { value: "citizens", text: "Representatives directly elected by citizens" },
          { value: "military", text: "Military leaders coordinating defense" },
          { value: "diplomats", text: "Foreign diplomats observing the agreement" },
          { value: "executive", text: "A single executive authority" }
        ],
        reveals: [
          "Who is described as having authority to act in this system?",
          "Is power given to individuals, or to political units?",
          "Re-read Fragment E, which explains how Congress is formed and who participates."
        ],
        correctMessage: "Correct: the document addresses delegates of the states in Congress assembled."
      },
      {
        id: "q2",
        number: 2,
        title: "What problem(s) was this document trying to solve?",
        meta: "(Select all that apply)",
        type: "multi",
        correct: ["unity"],
        options: [
          { value: "unity", text: "Lack of unity among states / securing interstate rights" },
          { value: "economy", text: "Creating a uniform national economy" },
          { value: "rebellions", text: "Preventing internal rebellions" },
          { value: "foreign", text: "Avoiding all foreign involvement" },
          { value: "enforce_states", text: "Enforcing laws within states" }
        ],
        reveals: [
          "What conflicts might arise if states acted completely independently?",
          "Notice repeated rules about treatment across state lines.",
          "Re-read Fragments A and B, which describe rights and trade between states."
        ],
        correctMessage: "Correct: the document focuses on unity among states and interstate rights/treatment."
      },
      {
        id: "q3",
        number: 3,
        title: "What powers are clearly granted in this document?",
        type: "single",
        correct: ["coordination"],
        options: [
          { value: "coordination", text: "Coordination among states" },
          { value: "tax", text: "Authority to tax individuals directly" },
          { value: "enforce", text: "Power to enforce laws within states" },
          { value: "internal_commerce", text: "Regulation of internal state commerce" },
          { value: "army", text: "Command of a permanent national army" }
        ],
        reveals: [
          "Focus on what the document explicitly allows—not what it discusses.",
          "Does the text describe enforcement or cooperation?",
          "Re-read Fragments E and F, focusing on what Congress can actually do."
        ],
        correctMessage: "Correct: the document grants a coordination framework among states."
      },
      {
        id: "q4",
        number: 4,
        title: "What problems does the document seem most concerned with?",
        meta: "(Select all that apply)",
        type: "multi",
        correct: ["unity_between_states", "collective_defense", "weak_central"],
        options: [
          { value: "unity_between_states", text: "Lack of unity between states" },
          { value: "collective_defense", text: "Collective defense" },
          { value: "weak_central", text: "Weak central authority" },
          { value: "civil_liberties", text: "Protecting individual civil liberties" },
          { value: "economic_growth", text: "Promoting economic growth" },
          { value: "popular_participation", text: "Encouraging popular participation" },
          { value: "territory", text: "Expanding national territory" }
        ],
        reveals: [
          "Which concerns appear in more than one fragment?",
          "Which problems require cooperation rather than command?",
          "Re-read Fragments A, B, D, and F and look for repeated themes."
        ],
        correctMessage: "Correct: the text repeatedly emphasizes unity, collective defense, and a limited/weak central authority."
      },
      {
        id: "q5",
        number: 5,
        title: "Why might humans have created it this way?",
        meta: "(Select all that apply)",
        type: "multi",
        correct: ["state_sovereignty", "militias", "movement", "supermajority"],
        options: [
          { value: "state_sovereignty", text: "Preserve state sovereignty while coordinating defense & diplomacy" },
          { value: "militias", text: "Prefer citizen militias over standing armies" },
          { value: "movement", text: "Facilitate cross-state movement of people/property without new duties" },
          { value: "supermajority", text: "Use supermajority rules to protect minority states on major actions" },
          { value: "rapid", text: "Enable rapid national decision-making" },
          { value: "executive", text: "Establish a strong centralized executive" },
          { value: "centralize_econ", text: "Centralize economic regulation" },
          { value: "unity_authority", text: "Encourage national unity through authority" }
        ],
        reveals: [
          "What does this system make deliberately difficult?",
          "Which rules slow decisions or limit power?",
          "Re-read Fragments D and F (military limits and voting rules)."
        ],
        correctMessage: "Correct: the structure prioritizes state sovereignty, limits standing armies, eases interstate movement, and uses supermajority safeguards."
      },
      {
        id: "q6",
        number: 6,
        title: "Based on the text alone, what fears or experiences shaped the authors?",
        type: "single",
        correct: ["tyranny"],
        options: [
          { value: "tyranny", text: "Fear of centralized tyranny" },
          { value: "participation", text: "Distrust of citizen participation" },
          { value: "competition", text: "Fear of economic competition" },
          { value: "permanence", text: "Desire for long-term political permanence" },
          { value: "diversity", text: "Anxiety over cultural diversity" }
        ],
        reveals: [
          "What type of power is most restricted in this document?",
          "Why might concentrated authority be treated cautiously?",
          "Re-read Fragments D and E, especially limits on military and enforcement power."
        ],
        correctMessage: "Correct: the text strongly limits centralized authority, reflecting fear of tyranny."
      },
      {
        id: "q7",
        number: 7,
        title: "What does this document reveal these beings fear most?",
        type: "single",
        correct: ["disunity"],
        options: [
          { value: "disunity", text: "Fragmentation and disunity" },
          { value: "popular", text: "Too much popular participation" },
          { value: "stagnation", text: "Economic stagnation" },
          { value: "cultural", text: "Foreign cultural influence" },
          { value: "inequality", text: "Regional inequality" }
        ],
        reveals: [
          "What outcome would make this agreement unnecessary?",
          "Why repeat rules about cooperation across states?",
          "Re-read Fragments A, B, and F, noting unity language."
        ],
        correctMessage: "Correct: the repeated cooperation/unity rules suggest the core fear is fragmentation."
      },
      {
        id: "q8",
        number: 8,
        title: "Based on the rules in this document, what major problem is most likely to emerge over time?",
        type: "single",
        correct: ["slow_action"],
        options: [
          { value: "slow_action", text: "The national government will struggle to act quickly or decisively" },
          { value: "lose_independence", text: "States will lose their independence to the central government" },
          { value: "too_much_citizen_power", text: "Citizens will gain too much direct political power" },
          { value: "military_dominates", text: "The military will become too powerful and dominate politics" },
          { value: "econ_controlled", text: "Economic growth will be tightly controlled by Congress" }
        ],
        reveals: [
          "Look for rules that require broad agreement before major actions can occur.",
          "Which design features slow decisions instead of speeding them up?",
          "Re-read Fragment F and note the voting thresholds and limits on centralized enforcement."
        ],
        correctMessage: "Correct: supermajority thresholds and limited enforcement make quick decisive national action difficult."
      }
    ];

    const quizEl = document.getElementById("quiz");

    function escapeHtml(str){
      return str.replace(/[&<>"']/g, (m) => ({
        "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"
      }[m]));
    }

    function renderQuestion(q){
      const meta = q.meta ? `<div class="qMeta">${escapeHtml(q.meta)}</div>` : "";
      const inputType = q.type === "multi" ? "checkbox" : "radio";

      const optionsHtml = q.options.map((opt, idx) => {
        const inputId = `${q.id}_${idx}`;
        const name = q.id; // group radios by name
        return `
          <div class="opt">
            <input
              id="${inputId}"
              type="${inputType}"
              name="${name}"
              value="${escapeHtml(opt.value)}"
              aria-describedby="${q.id}_desc"
            />
            <label for="${inputId}">
              <span class="optText">${escapeHtml(opt.text)}</span>
            </label>
          </div>
        `;
      }).join("");

      return `
        <section class="card" aria-labelledby="${q.id}_title">
          <div class="qTop">
            <div class="qNum" aria-hidden="true">${q.number}</div>
            <div class="qHead">
              <h2 id="${q.id}_title">${escapeHtml(q.title)}</h2>
              ${meta}
              <div id="${q.id}_desc" class="hintNote">
                Tip: Use Tab/Shift+Tab to move, Space to select. Your selections are announced by screen readers.
              </div>
            </div>
          </div>

          <div class="qBody">
            <form data-qid="${q.id}">
              <fieldset>
                <legend class="sr-only" style="position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden;">
                  ${escapeHtml(q.title)}
                </legend>

                <div class="options">
                  ${optionsHtml}
                </div>

                <div class="controls">
                  <button type="button" class="btnCheck" data-action="check" aria-controls="${q.id}_feedback">
                    Check answer
                  </button>
                  <button type="button" class="btnSecondary" data-action="reset" aria-controls="${q.id}_feedback ${q.id}_reveals">
                    Reset
                  </button>
                  <button type="button"
                          class="btnSecondary"
                          data-action="reveal"
                          aria-expanded="false"
                          aria-controls="${q.id}_reveals">
                    Show next clue
                  </button>
                </div>

                <div id="${q.id}_feedback"
                     class="feedback"
                     role="status"
                     aria-live="polite"
                     aria-atomic="true"
                     hidden></div>

                <div id="${q.id}_reveals" class="reveals" hidden>
                  <h3>Progressive reveals</h3>
                  <ol class="revealList" aria-label="Clues revealed so far"></ol>
                </div>
              </fieldset>
            </form>
          </div>
        </section>
      `;
    }

    function getSelections(form, q){
      const inputs = Array.from(form.querySelectorAll("input"));
      const selected = inputs.filter(i => i.checked).map(i => i.value);
      return selected;
    }

    function setsEqual(a, b){
      if (a.length !== b.length) return false;
      const sa = new Set(a);
      for (const x of b) if (!sa.has(x)) return false;
      return true;
    }

    function checkAnswer(form, q){
      const selected = getSelections(form, q);
      const feedbackEl = form.querySelector(`#${q.id}_feedback`);

      if (selected.length === 0){
        feedbackEl.className = "feedback bad";
        feedbackEl.hidden = false;
        feedbackEl.innerHTML = `<strong>Not yet:</strong> Please select an answer${q.type === "multi" ? " (one or more)" : ""} before checking.`;
        return;
      }

      const isCorrect = (q.type === "multi")
        ? setsEqual([...selected].sort(), [...q.correct].sort())
        : (selected.length === 1 && selected[0] === q.correct[0]);

      if (isCorrect){
        feedbackEl.className = "feedback good";
        feedbackEl.hidden = false;
        feedbackEl.innerHTML = `<strong>✅ Correct.</strong> ${escapeHtml(q.correctMessage)}`;
      } else {
        feedbackEl.className = "feedback bad";
        feedbackEl.hidden = false;

        // Provide a helpful, not-overly-revealing nudge (still accessible)
        const nudge = (q.type === "multi")
          ? "Try again: for multi-select questions, the correct set must include all correct choices and no incorrect ones."
          : "Try again: choose the option best supported by the fragments.";
        feedbackEl.innerHTML = `<strong>❌ Not quite.</strong> ${escapeHtml(nudge)}`;
      }
    }

    function resetQuestion(form, q){
      const inputs = Array.from(form.querySelectorAll("input"));
      inputs.forEach(i => i.checked = false);

      const feedbackEl = form.querySelector(`#${q.id}_feedback`);
      feedbackEl.hidden = true;
      feedbackEl.textContent = "";
      feedbackEl.className = "feedback";

      const revealsWrap = form.querySelector(`#${q.id}_reveals`);
      const list = revealsWrap.querySelector(".revealList");
      list.innerHTML = "";
      revealsWrap.hidden = true;

      const revealBtn = form.querySelector(`button[data-action="reveal"]`);
      revealBtn.dataset.step = "0";
      revealBtn.disabled = false;
      revealBtn.setAttribute("aria-expanded", "false");
      revealBtn.textContent = "Show next clue";
    }

    function revealNext(form, q){
      const revealBtn = form.querySelector(`button[data-action="reveal"]`);
      const step = Number(revealBtn.dataset.step || "0");
      const next = q.reveals[step];

      const revealsWrap = form.querySelector(`#${q.id}_reveals`);
      const list = revealsWrap.querySelector(".revealList");

      // Show reveals container on first reveal
      revealsWrap.hidden = false;
      revealBtn.setAttribute("aria-expanded", "true");

      if (next){
        const li = document.createElement("li");
        li.textContent = next;
        list.appendChild(li);

        revealBtn.dataset.step = String(step + 1);

        if (step + 1 >= q.reveals.length){
          revealBtn.disabled = true;
          revealBtn.textContent = "All clues shown";
        }
      } else {
        revealBtn.disabled = true;
        revealBtn.textContent = "All clues shown";
      }
    }

    // Render all questions
    quizEl.innerHTML = quizData.map(renderQuestion).join("");

    // Wire up events
    quizEl.addEventListener("click", (e) => {
      const btn = e.target.closest("button");
      if (!btn) return;

      const form = btn.closest("form");
      const qid = form?.dataset?.qid;
      const q = quizData.find(x => x.id === qid);
      if (!q) return;

      const action = btn.dataset.action;

      if (action === "check") checkAnswer(form, q);
      if (action === "reset") resetQuestion(form, q);
      if (action === "reveal") revealNext(form, q);
    });

    // Initialize reveal buttons
    document.querySelectorAll('button[data-action="reveal"]').forEach(btn => {
      btn.dataset.step = "0";
    });
  </script>
</body>
</html>
