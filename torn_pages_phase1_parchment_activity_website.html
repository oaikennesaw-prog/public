<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Alien Archivists – Phase I (Parchment Scroll)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root{
      --bg:#000000;         /* BLACK background */
      --panel:#1c2541;
      --ink:#1b1b1b;
      --accent:#5bc0be;
      --accent2:#2a9d8f;
      --warn:#f4a261;
      --muted:#a8c0d8;
      --border:#2a3a5f;
    }
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color:#e8eef7;
    }

    header{
      position: sticky;
      top: 0;
      z-index: 20;
      padding:1rem 1.5rem;
      background:#000; /* match black background */
      border-bottom:2px solid var(--accent);
    }
    header h1{ margin:0; padding-right: 48px; }

    /* Top-right close button */
    .cornerClose{
      position:absolute;
      right: 14px;
      top: 14px;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.06);
      color:#fff;
      font-size: 18px;
      font-weight: 900;
      line-height: 36px;
      text-align: center;
      cursor: pointer;
      user-select: none;
    }
    .cornerClose:hover{
      background: rgba(255,255,255,0.12);
    }

    main{
      display:grid;
      grid-template-columns: 1fr;
      gap:1rem;
      padding:1rem;
    }
    @media (min-width: 980px){
      main{ grid-template-columns: 1.4fr 0.9fr; align-items:start; }
    }

    .papers{
      display:flex;
      flex-direction: column;
      gap:1rem;
    }

    .paper{
      position:relative;
      padding:1.2rem 1.4rem;
      color:var(--ink);
      border-radius:8px;
      box-shadow:0 10px 20px rgba(0,0,0,0.25);
      background: #f3e6c6;
      background-image:
        radial-gradient(circle at 10% 10%, rgba(0,0,0,0.05), transparent 35%),
        radial-gradient(circle at 90% 30%, rgba(0,0,0,0.04), transparent 40%),
        radial-gradient(circle at 30% 90%, rgba(0,0,0,0.03), transparent 45%);
    }
    .paper::before, .paper::after{
      content:'';
      position:absolute;
      left:0; right:0;
      height:16px;
    }
    .paper::before{
      top:0;
      background: linear-gradient(to bottom, rgba(0,0,0,0.18), rgba(0,0,0,0));
      border-top-left-radius:8px;
      border-top-right-radius:8px;
    }
    .paper::after{
      bottom:0;
      background: linear-gradient(to top, rgba(0,0,0,0.18), rgba(0,0,0,0));
      border-bottom-left-radius:8px;
      border-bottom-right-radius:8px;
    }

    .paper h3{
      margin:0 0 0.6rem;
      color:#3a3a3a;
      font-weight:800;
      letter-spacing:0.02em;
      padding-left:56px;
    }
    .badge{
      position:absolute;
      left:12px;
      top:12px;
      width:36px;
      height:36px;
      border-radius:50%;
      display:grid;
      place-items:center;
      font-weight:900;
      color:#0b132b;
      background: var(--accent);
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    }
    .stamp{
      position:absolute;
      right:8px;
      top:8px;
      background: rgba(91,192,190,0.12);
      color:#236d6b;
      border:2px dashed #5bc0be;
      border-radius:6px;
      font-weight:800;
      padding:0.2rem 0.5rem;
      transform: rotate(-6deg);
    }
    .paper p{
      line-height:1.6;
      font-size:1.05rem;
      margin:0;
    }

    .missing{
      background: repeating-linear-gradient(45deg,#eee 0,#eee 6px,#ddd 6px,#ddd 12px);
      color:#666;
      padding:0 6px;
      border-radius:4px;
      border:1px dashed #999;
      white-space: nowrap;
    }

    .hint{
      font-weight: inherit;
      background: transparent;
      border-radius:4px;
      padding:0 2px;
      transition: box-shadow .2s ease, background .2s ease, font-weight .2s ease;
    }
    .hint.active{
      font-weight:800;
      background: rgba(243,209,0,0.25);
      box-shadow: 0 0 0 3px rgba(243,209,0,0.35);
    }

    .sidebar{
      background: var(--panel);
      border:1px solid var(--border);
      border-radius:10px;
      padding:1rem;
    }
    .sidebar h2{ margin:0 0 0.5rem; }
    .subhead{ color:var(--muted); margin:0 0 1rem; font-size:0.95rem; }

    .progress{
      border:1px solid var(--border);
      background:#0f2140;
      border-radius:10px;
      padding:0.8rem;
      margin-bottom:1rem;
    }
    .progress h3{ margin:0 0 0.4rem; font-size:1rem; }
    .steps{
      display:grid;
      grid-template-columns: repeat(4, 1fr);
      gap:0.5rem;
    }
    @media (min-width: 980px){
      .steps{ grid-template-columns: repeat(8, 1fr); }
    }
    .dot{
      width:26px;
      height:26px;
      border-radius:50%;
      display:grid;
      place-items:center;
      font-weight:900;
      border:2px solid var(--border);
      background:#0e1a31;
      color:#d7e6ff;
      user-select:none;
    }
    .dot.done{
      border-color: rgba(42,157,143,0.9);
      background: rgba(42,157,143,0.25);
      color:#d7fff7;
    }

    .q{
      margin-top:1rem;
      padding-top:1rem;
      border-top:1px solid rgba(255,255,255,0.12);
    }
    .q:first-of-type{ border-top:none; padding-top:0; margin-top:0; }

    .q label.title{
      display:block;
      margin:0 0 0.5rem;
      font-weight:800;
      font-size:1rem;
      line-height:1.35;
    }
    .options{
      display:grid;
      gap:0.35rem;
      margin-bottom:0.4rem;
    }
    .options label{
      display:flex;
      gap:0.5rem;
      align-items:flex-start;
      line-height:1.35;
    }

    .btnbar{
      display:flex;
      gap:0.5rem;
      flex-wrap:wrap;
      align-items:center;
      margin-top:0.6rem;
    }

    button{
      background: var(--accent);
      border:none;
      color:#0b132b;
      padding:0.6rem 0.9rem;
      border-radius:8px;
      font-weight:800;
      cursor:pointer;
    }
    button.secondary{ background: var(--accent2); color:#0b132b; }
    button.ghost{
      background: transparent;
      border:1px solid var(--accent);
      color:#e8eef7;
    }
    button:disabled{
      opacity:0.5;
      cursor:not-allowed;
    }

    .link{
      color:#5bc0be;
      cursor:pointer;
      text-decoration: underline;
      font-weight:800;
      user-select:none;
    }

    .msg{ font-size:0.95rem; margin-top:0.6rem; }
    .ok{ color:#2a9d8f; font-weight:900; }
    .err{ color:#f4a261; font-weight:800; }

    .revealBox{
      border:1px solid rgba(255,255,255,0.14);
      background: rgba(0,0,0,0.16);
      padding:0.6rem 0.7rem;
      border-radius:10px;
      margin-top:0.6rem;
      display:none;
    }
    .revealBox strong{ color:#d7fff7; }
    .revealText{ color:#e8eef7; line-height:1.4; margin-top:0.3rem; }
  </style>
</head>

<body>
  <header>
    <h1>Alien Archivists · Phase I: Parchment Scroll</h1>
    <div class="cornerClose" id="cornerClose" title="Close">✕</div>
  </header>

  <main>
    <section>
      <div class="papers" aria-label="Parchment fragments">

        <figure id="fragA" class="paper" aria-labelledby="fragA-title">
          <div class="badge" aria-hidden="true">A</div>
          <div class="stamp" aria-hidden="true">Fragment A</div>
          <h3 id="fragA-title">Privileges & Immunities</h3>
          <p>
            … better to secure and perpetuate <span class="hint">mutual friendship</span> and intercourse
            among the people of the different states in this union, the free inhabitants of each of these
            states, paupers, vagabonds and fugitives from Justice excepted, shall be entitled to all
            <span class="hint">privileges and immunities</span> of free citizens …
          </p>
        </figure>

        <figure id="fragB" class="paper" aria-labelledby="fragB-title">
          <div class="badge" aria-hidden="true">B</div>
          <div class="stamp" aria-hidden="true">Fragment B</div>
          <h3 id="fragB-title">Trade & Property</h3>
          <p>
            … the inhabitants thereof respectively, provided that such restrictions shall not extend so
            far as to prevent the removal of property imported into any state, to any other State of which
            the Owner is an inhabitant; provided also that <span class="hint">no imposition, duties or restriction</span>
            shall be laid by any state, on the property of the united states, or either of them …
          </p>
        </figure>

        <figure id="fragC" class="paper" aria-labelledby="fragC-title">
          <div class="badge" aria-hidden="true">C</div>
          <div class="stamp" aria-hidden="true">Fragment C</div>
          <h3 id="fragC-title">Foreign Embassies & Titles</h3>
          <p>
            No <span class="missing">state, without the consent of the united states in congress assembled</span>,
            shall <span class="hint">send any embassy</span> to, or receive any embassy from, or enter into any
            conferrence, agreement, alliance, or <span class="hint">treaty</span>, with any King prince or state;
            nor shall the united states, in congress assembled, or any of them, grant any
            <span class="hint">title of nobility</span> …
          </p>
        </figure>

        <figure id="fragD" class="paper" aria-labelledby="fragD-title">
          <div class="badge" aria-hidden="true">D</div>
          <div class="stamp" aria-hidden="true">Fragment D</div>
          <h3 id="fragD-title">Standing Forces & Militia</h3>
          <p>
            No <span class="hint">vessels of war</span> shall be kept up in time of peace, by any state, except such
            number only, as shall be deemed necessary by
            <span class="missing">the united states in congress assembled</span>
            for the defence of such state, or its trade; nor shall any body of forces be kept up, by any state,
            in time of peace, except such number only as, in the judgment of
            <span class="missing">the united states in congress assembled</span>,
            shall be deemed requisite to garrison the forts necessary for the defence of such state; but every
            state shall always keep up a <span class="hint">well regulated and disciplined militia</span>, sufficiently
            armed and accoutred, and shall provide and constantly have ready for use, in public stores, a due
            number of field pieces and tents, and a proper quantity of
            <span class="hint">arms, ammunition</span>, and camp equipage.
          </p>
        </figure>

        <figure id="fragE" class="paper" aria-labelledby="fragE-title">
          <div class="badge" aria-hidden="true">E</div>
          <div class="stamp" aria-hidden="true">Fragment E</div>
          <h3 id="fragE-title">Ratification</h3>
          <p>
            Whereas it hath pleased the Great Governor of the World to incline the hearts of the legislatures
            we respectively represent in congress, to approve of, and to authorize us to ratify the said
            articles of confederation and perpetual union, Know Ye, that we, the
            <span class="hint">undersigned delegates</span>, by virtue of the power and authority to us given for
            that purpose, do, by these presents, in the name and in behalf of our respective constituents,
            fully and entirely <span class="hint">ratify and confirm</span> …
          </p>
        </figure>

        <figure id="fragF" class="paper" aria-labelledby="fragF-title">
          <div class="badge" aria-hidden="true">F</div>
          <div class="stamp" aria-hidden="true">Fragment F</div>
          <h3 id="fragF-title">Supermajority Rule</h3>
          <p>
            … shall never engage in a war, nor grant letters of marque and reprisal in time of peace, nor
            enter into any treaties or alliances, nor coin money, nor regulate the value thereof nor ..ascertain
            the sums and expenses necessary for the defence and welfare…, or any of them, nor emit bills, nor
            borrow money on the credit of the united states, nor appropriate money, nor agree upon the number
            of vessels of war to be built or purchased, or the number of land or sea forces to be raised, nor
            appoint a commander in chief of the army or navy, unless
            <span class="hint">nine states assent</span> to the same, nor shall a question on any other point, except
            for adjourning from day to day, be determined, unless by the votes of a
            <span class="hint">majority</span> of the
            <span class="missing">united states in congress assembled</span>.
          </p>
        </figure>

      </div>
    </section>

    <section class="sidebar" aria-label="Phase I Questions">
      <h2>Phase I · Questions</h2>
      <p class="subhead">Answer in any order. Use “Reveal” to see hint 1 → 2 → 3. Progress saves automatically.</p>

      <div class="progress" aria-label="Progress tracker">
        <h3>Progress</h3>
        <div id="dots" class="steps" aria-label="Question progress dots"></div>

        <div class="btnbar" style="margin-top:0.7rem;">
          <button class="ghost" id="resetProgress">Reset progress</button>
          <button class="ghost" id="emailResults">Email my results</button>
          <button class="ghost" id="copyResults">Copy results</button>
          <span id="allDoneMsg" class="msg"></span>
        </div>

        <div class="revealBox" id="emailHelp" style="display:block; margin-top:0.7rem;">
          <strong>Email note</strong>
          <div class="revealText">
            This opens your email app with the results pre-filled. It does not send automatically.
          </div>
        </div>
      </div>

      <div id="questions"></div>
    </section>
  </main>

  <script>
    /***********************
     * Highlight helpers
     ***********************/
    function persistHints(selector){
      document.querySelectorAll(selector).forEach(el => el.classList.add('active'));
    }
    function clearHints(selector){
      document.querySelectorAll(selector).forEach(el => el.classList.remove('active'));
    }
    function clearAllHighlights(){
      clearHints(".hint");
    }

    /***********************
     * Question definition
     ***********************/
    const QUESTIONS = [
      {
        id: 1,
        title: "Q1. Who was the intended audience?",
        type: "radio",
        options: [
          { value:"delegates", label:"Delegates of the states in Congress assembled" },
          { value:"citizens", label:"Representatives directly elected by citizens" },
          { value:"military", label:"Military leaders coordinating defense" },
          { value:"foreign", label:"Foreign diplomats observing the agreement" },
          { value:"executive", label:"A single executive authority" },
        ],
        correct: "delegates",
        reveals: [
          "“Who is described as having authority to act in this system?”",
          "“Is power given to individuals, or to political units?”",
          "“Re-read Fragment E, which explains how Congress is formed and who participates.”"
        ],
        highlightOnReveal3: "#fragE .hint"
      },
      {
        id: 2,
        title: "Q2. What problem(s) was this document trying to solve? (Select all that apply)",
        type: "checkbox",
        options: [
          { value:"unity", label:"Lack of unity among states / securing interstate rights" },
          { value:"economy", label:"Creating a uniform national economy" },
          { value:"rebellions", label:"Preventing internal rebellions" },
          { value:"avoid_foreign", label:"Avoiding all foreign involvement" },
          { value:"enforce_state", label:"Enforcing laws within states" },
        ],
        correct: ["unity"],
        reveals: [
          "“What conflicts might arise if states acted completely independently?”",
          "“Notice repeated rules about treatment across state lines.”",
          "“Re-read Fragments A and B, which describe rights and trade between states.”"
        ],
        highlightOnReveal3: "#fragA .hint, #fragB .hint"
      },
      {
        id: 3,
        title: "Q3. What powers are clearly granted in this document?",
        type: "radio",
        options: [
          { value:"coord", label:"Coordination among states" },
          { value:"tax", label:"Authority to tax individuals directly" },
          { value:"enforce", label:"Power to enforce laws within states" },
          { value:"commerce", label:"Regulation of internal state commerce" },
          { value:"army", label:"Command of a permanent national army" },
        ],
        correct: "coord",
        reveals: [
          "“Focus on what the document explicitly allows—not what it discusses.”",
          "“Does the text describe enforcement or cooperation?”",
          "“Re-read Fragments E and F, focusing on what Congress can actually do.”"
        ],
        highlightOnReveal3: "#fragE .hint, #fragF .hint"
      },
      {
        id: 4,
        title: "Q4. What problems does the document seem most concerned with? (Select all that apply)",
        type: "checkbox",
        options: [
          { value:"unity", label:"Lack of unity between states" },
          { value:"defense", label:"Collective defense" },
          { value:"weak_central", label:"Weak central authority" },
          { value:"civil_lib", label:"Protecting individual civil liberties" },
          { value:"growth", label:"Promoting economic growth" },
          { value:"participation", label:"Encouraging popular participation" },
          { value:"territory", label:"Expanding national territory" },
        ],
        correct: ["unity","defense","weak_central"],
        reveals: [
          "“Which concerns appear in more than one fragment?”",
          "“Which problems require cooperation rather than command?”",
          "“Re-read Fragments A, B, D, and F and look for repeated themes.”"
        ],
        highlightOnReveal3: "#fragA .hint, #fragB .hint, #fragD .hint, #fragF .hint"
      },
      {
        id: 5,
        title: "Q5. Why might humans have created it this way? (Select all that apply)",
        type: "checkbox",
        options: [
          { value:"sovereignty", label:"Preserve state sovereignty while coordinating defense & diplomacy" },
          { value:"militias", label:"Prefer citizen militias over standing armies" },
          { value:"movement", label:"Facilitate cross-state movement of people/property without new duties" },
          { value:"supermajority", label:"Use supermajority rules to protect minority states on major actions" },
          { value:"rapid", label:"Enable rapid national decision-making" },
          { value:"exec", label:"Establish a strong centralized executive" },
          { value:"econ_reg", label:"Centralize economic regulation" },
          { value:"unity_authority", label:"Encourage national unity through authority" },
        ],
        correct: ["sovereignty","militias","movement","supermajority"],
        reveals: [
          "“What does this system make deliberately difficult?”",
          "“Which rules slow decisions or limit power?”",
          "“Re-read Fragments D and F (military limits and voting rules).”"
        ],
        highlightOnReveal3: "#fragD .hint, #fragF .hint"
      },
      {
        id: 6,
        title: "Q6. Based on the text alone, what fears or experiences shaped the authors?",
        type: "radio",
        options: [
          { value:"tyranny", label:"Fear of centralized tyranny" },
          { value:"distrust", label:"Distrust of citizen participation" },
          { value:"competition", label:"Fear of economic competition" },
          { value:"permanence", label:"Desire for long-term political permanence" },
          { value:"diversity", label:"Anxiety over cultural diversity" },
        ],
        correct: "tyranny",
        reveals: [
          "“What type of power is most restricted in this document?”",
          "“Why might concentrated authority be treated cautiously?”",
          "“Re-read Fragments D and E, especially limits on military and enforcement power.”"
        ],
        highlightOnReveal3: "#fragD .hint, #fragE .hint"
      },
      {
        id: 7,
        title: "Q7. What does this document reveal these beings fear most?",
        type: "radio",
        options: [
          { value:"disunity", label:"Fragmentation and disunity" },
          { value:"popular", label:"Too much popular participation" },
          { value:"stagnation", label:"Economic stagnation" },
          { value:"foreign_culture", label:"Foreign cultural influence" },
          { value:"inequality", label:"Regional inequality" },
        ],
        correct: "disunity",
        reveals: [
          "“What outcome would make this agreement unnecessary?”",
          "“Why repeat rules about cooperation across states?”",
          "“Re-read Fragments A, B, and F, noting unity language.”"
        ],
        highlightOnReveal3: "#fragA .hint, #fragB .hint, #fragF .hint"
      },
      {
        id: 8,
        title: "Q8. What does this document reveal about what these beings fear? (This is about the system’s anxieties, not the authors’ personal experiences.)",
        type: "radio",
        options: [
          { value:"disunity", label:"Fragmentation and disunity" },
          { value:"popular", label:"Too much popular participation" },
          { value:"decline", label:"Economic decline or stagnation" },
          { value:"cultural", label:"Cultural differences between regions" },
          { value:"prestige", label:"Loss of international prestige" },
        ],
        correct: "disunity",
        reveals: [
          "“What outcome would make this agreement unnecessary?”",
          "“Why repeat rules about cooperation, shared defense, and mutual treatment?”",
          "“Re-read Fragments A, B, and F and look for repeated unity language.”"
        ],
        highlightOnReveal3: "#fragA .hint, #fragB .hint, #fragF .hint"
      },
    ];

    /********************
     * Save/Load state
     ********************/
    const KEY = "phase1:progress:unlocked:v2";

    function defaultState(){
      return {
        done: Array(QUESTIONS.length).fill(false),
        revealIndex: Array(QUESTIONS.length).fill(0)
      };
    }

    function loadState(){
      try{
        const s = JSON.parse(localStorage.getItem(KEY));
        if (!s || !Array.isArray(s.done) || !Array.isArray(s.revealIndex)) return defaultState();
        if (s.done.length !== QUESTIONS.length) return defaultState();
        if (s.revealIndex.length !== QUESTIONS.length) return defaultState();
        return s;
      } catch(e){
        return defaultState();
      }
    }

    function saveState(state){
      localStorage.setItem(KEY, JSON.stringify(state));
    }

    function isArrayEqualAsSet(a, b){
      if (a.length !== b.length) return false;
      const sa = new Set(a);
      return b.every(x => sa.has(x));
    }

    function getUserAnswer(q){
      if (q.type === "radio"){
        return document.querySelector(`input[name="q${q.id}"]:checked`)?.value ?? null;
      }
      return [...document.querySelectorAll(`input[name="q${q.id}"]:checked`)].map(i => i.value);
    }

    function freezeQuestion(qId){
      const box = document.getElementById(`q${qId}`);
      if (!box) return;
      box.querySelectorAll("input").forEach(i => i.disabled = true);
      const submit = document.getElementById(`submit${qId}`);
      const reveal = document.getElementById(`reveal${qId}`);
      if (submit) submit.disabled = true;
      if (reveal) reveal.disabled = true;
    }

    /********************
     * Build UI
     ********************/
    function buildDots(){
      const dots = document.getElementById("dots");
      dots.innerHTML = "";
      QUESTIONS.forEach(q => {
        const d = document.createElement("div");
        d.className = "dot";
        d.id = `dot${q.id}`;
        d.textContent = q.id;
        d.title = `Question ${q.id}`;
        dots.appendChild(d);
      });
    }

    function buildQuestions(){
      const container = document.getElementById("questions");
      container.innerHTML = "";

      QUESTIONS.forEach(q => {
        const box = document.createElement("div");
        box.className = "q";
        box.id = `q${q.id}`;

        const title = document.createElement("label");
        title.className = "title";
        title.innerHTML = q.title;
        box.appendChild(title);

        const opts = document.createElement("div");
        opts.className = "options";

        q.options.forEach(o => {
          const lab = document.createElement("label");
          const input = document.createElement("input");
          input.type = q.type;
          input.name = `q${q.id}`;
          input.value = o.value;

          const span = document.createElement("span");
          span.textContent = o.label;

          lab.appendChild(input);
          lab.appendChild(span);
          opts.appendChild(lab);
        });

        box.appendChild(opts);

        const btnbar = document.createElement("div");
        btnbar.className = "btnbar";

        const revealBtn = document.createElement("button");
        revealBtn.className = "ghost";
        revealBtn.id = `reveal${q.id}`;
        revealBtn.textContent = "Reveal";
        revealBtn.addEventListener("click", () => revealHint(q.id));
        btnbar.appendChild(revealBtn);

        const clear = document.createElement("span");
        clear.className = "link";
        clear.textContent = "Clear highlights";
        clear.addEventListener("click", () => clearAllHighlights());
        btnbar.appendChild(clear);

        const submitBtn = document.createElement("button");
        submitBtn.className = "secondary";
        submitBtn.id = `submit${q.id}`;
        submitBtn.textContent = `Submit Q${q.id}`;
        submitBtn.addEventListener("click", () => submitAnswer(q.id));
        btnbar.appendChild(submitBtn);

        const msg = document.createElement("span");
        msg.id = `msg${q.id}`;
        msg.className = "msg";
        btnbar.appendChild(msg);

        box.appendChild(btnbar);

        const revealBox = document.createElement("div");
        revealBox.className = "revealBox";
        revealBox.id = `revealBox${q.id}`;
        revealBox.innerHTML = `<strong>Progressive reveal</strong><div class="revealText" id="revealText${q.id}"></div>`;
        box.appendChild(revealBox);

        container.appendChild(box);
      });
    }

    /********************
     * Reveals
     ********************/
    function revealHint(qId){
      const q = QUESTIONS.find(x => x.id === qId);
      const state = loadState();
      const idx = state.revealIndex[qId - 1] || 0;

      const box = document.getElementById(`revealBox${qId}`);
      const text = document.getElementById(`revealText${qId}`);
      if (!box || !text) return;

      box.style.display = "block";

      const which = Math.min(idx, q.reveals.length - 1);
      text.innerHTML = `<strong>Reveal ${which + 1}:</strong><br>${q.reveals[which]}`;

      if (which === 2 && q.highlightOnReveal3){
        persistHints(q.highlightOnReveal3);
      }

      state.revealIndex[qId - 1] = Math.min(idx + 1, q.reveals.length);
      saveState(state);
    }

    /********************
     * Submit logic
     ********************/
    function submitAnswer(qId){
      const q = QUESTIONS.find(x => x.id === qId);
      const msg = document.getElementById(`msg${qId}`);

      const ans = getUserAnswer(q);
      if (q.type === "radio" && !ans){
        msg.innerHTML = `<span class="err">Select one option first.</span>`;
        return;
      }
      if (q.type === "checkbox" && Array.isArray(ans) && ans.length === 0){
        msg.innerHTML = `<span class="err">Select at least one option.</span>`;
        return;
      }

      const correct =
        q.type === "radio"
          ? (ans === q.correct)
          : isArrayEqualAsSet(ans, q.correct);

      if (!correct){
        msg.innerHTML = `<span class="err">Not quite. Try using Reveal 1 → 2 → 3.</span>`;
        return;
      }

      msg.innerHTML = `<span class="ok">Correct ✅</span>`;

      const state = loadState();
      state.done[qId - 1] = true;
      saveState(state);

      updateUI();
    }

    /********************
     * Results (copy + email)
     ********************/
    function buildResultsText(){
      const state = loadState();
      const lines = [];
      lines.push("Alien Archivists – Phase I Results");
      lines.push("----------------------------------");
      QUESTIONS.forEach(q => {
        const done = state.done[q.id - 1] ? "Correct ✅" : "Not completed";
        const ans = getUserAnswer(q);
        let ansText = "";
        if (q.type === "radio"){
          ansText = ans ? q.options.find(o => o.value === ans)?.label ?? ans : "(no answer selected)";
        } else {
          if (!Array.isArray(ans) || ans.length === 0) ansText = "(no answers selected)";
          else ansText = ans.map(v => q.options.find(o => o.value === v)?.label ?? v).join("; ");
        }
        lines.push(`Q${q.id}: ${done}`);
        lines.push(`Selected: ${ansText}`);
        lines.push("");
      });
      return lines.join("\n");
    }

    document.getElementById("copyResults").addEventListener("click", async () => {
      const txt = buildResultsText();
      try{
        await navigator.clipboard.writeText(txt);
        alert("Results copied to clipboard.");
      } catch(e){
        // fallback
        prompt("Copy your results below:", txt);
      }
    });

    document.getElementById("emailResults").addEventListener("click", () => {
      const txt = buildResultsText();
      const subject = encodeURIComponent("Alien Archivists – Phase I Results");
      const body = encodeURIComponent(txt + "\n\n(Generated from the activity page)");
      // Student email apps will open; they can send to themselves or their instructor.
      window.location.href = `mailto:?subject=${subject}&body=${body}`;
    });

    /********************
     * UI refresh
     ********************/
    function updateDots(state){
      QUESTIONS.forEach(q => {
        const d = document.getElementById(`dot${q.id}`);
        if (!d) return;
        const done = !!state.done[q.id - 1];
        d.classList.toggle("done", done);
        d.textContent = done ? "✓" : String(q.id);
      });

      const allDoneMsg = document.getElementById("allDoneMsg");
      if (allDoneMsg){
        allDoneMsg.innerHTML = state.done.every(Boolean) ? `<span class="ok">All complete ✅</span>` : "";
      }
    }

    function restoreRevealBoxes(state){
      QUESTIONS.forEach(q => {
        const idx = state.revealIndex[q.id - 1] || 0;
        if (idx <= 0) return;

        const box = document.getElementById(`revealBox${q.id}`);
        const text = document.getElementById(`revealText${q.id}`);
        if (!box || !text) return;

        box.style.display = "block";
        const which = Math.min(idx - 1, q.reveals.length - 1);
        text.innerHTML = `<strong>Reveal ${which + 1}:</strong><br>${q.reveals[which]}`;

        if (which === 2 && q.highlightOnReveal3){
          persistHints(q.highlightOnReveal3);
        }
      });
    }

    function freezeDone(state){
      QUESTIONS.forEach(q => {
        if (state.done[q.id - 1]) freezeQuestion(q.id);
      });
    }

    function updateUI(){
      const state = loadState();
      updateDots(state);
      restoreRevealBoxes(state);
      freezeDone(state);
    }

    /********************
     * Reset
     ********************/
    document.getElementById("resetProgress").addEventListener("click", () => {
      if (!confirm("Reset progress, answers, and reveals?")) return;

      localStorage.removeItem(KEY);
      clearAllHighlights();

      QUESTIONS.forEach(q => {
        const box = document.getElementById(`q${q.id}`);
        if (!box) return;

        box.querySelectorAll("input").forEach(i => {
          i.disabled = false;
          i.checked = false;
        });

        const msg = document.getElementById(`msg${q.id}`);
        if (msg) msg.textContent = "";

        const rbox = document.getElementById(`revealBox${q.id}`);
        if (rbox) rbox.style.display = "none";

        const submit = document.getElementById(`submit${q.id}`);
        const reveal = document.getElementById(`reveal${q.id}`);
        if (submit) submit.disabled = false;
        if (reveal) reveal.disabled = false;
      });

      updateUI();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    /********************
     * Close corner button
     ********************/
    function attemptClose(){
      window.close();
      setTimeout(() => {
        if (!window.closed) {
          alert("Your browser blocked closing this tab. You can close it with Ctrl/⌘+W.");
        }
      }, 200);
    }
    document.getElementById("cornerClose").addEventListener("click", attemptClose);

    /********************
     * Init
     ********************/
    buildDots();
    buildQuestions();
    updateUI();
  </script>
</body>
</html>
