<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fragments Quiz</title>
  <style>
    :root{
      --bg:#0b1220;
      --card:#111a2e;
      --text:#e8eefc;
      --muted:#a9b7da;
      --border:#243252;
      --good:#39d98a;
      --bad:#ff6b6b;
      --accent:#7aa2ff;
      --shadow: 0 12px 30px rgba(0,0,0,.35);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      background: radial-gradient(1200px 600px at 20% 0%, #142246 0%, var(--bg) 55%) fixed;
      color:var(--text);
      line-height:1.35;
      padding:24px;
    }
    .wrap{max-width: 980px; margin: 0 auto;}
    header{
      display:flex; align-items:flex-start; justify-content:space-between; gap:16px;
      margin-bottom:16px;
    }
    h1{font-size:20px; margin:0; letter-spacing:.2px;}
    .sub{color:var(--muted); font-size:13px; margin-top:6px;}
    .card{
      background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.01));
      border:1px solid var(--border);
      border-radius:14px;
      box-shadow: var(--shadow);
      padding:18px;
    }
    .row{display:flex; gap:12px; flex-wrap:wrap; align-items:center;}
    .pill{
      display:inline-flex; gap:8px; align-items:center;
      padding:6px 10px; border-radius:999px;
      border:1px solid var(--border);
      background: rgba(255,255,255,.03);
      color: var(--muted);
      font-size:12px;
    }
    .pill b{color:var(--text); font-weight:600;}
    .qhead{
      display:flex; justify-content:space-between; gap:12px; align-items:flex-start;
      margin-bottom:10px;
    }
    .qnum{
      font-size:12px; color:var(--muted); letter-spacing:.12em; text-transform:uppercase;
    }
    .prompt{
      font-size:18px; margin:6px 0 0 0;
    }
    .hintline{
      margin-top:8px;
      font-size:13px;
      color:var(--muted);
    }
    .choices{margin-top:14px; display:grid; gap:10px;}
    .choice{
      border:1px solid var(--border);
      border-radius:12px;
      padding:10px 12px;
      background: rgba(255,255,255,.02);
      display:flex;
      gap:10px;
      align-items:flex-start;
      transition: transform .05s ease, border-color .15s ease, background .15s ease;
    }
    .choice:hover{border-color:#34508a; background: rgba(122,162,255,.06);}
    /* Fix: consistent circles for radios and squares for checkboxes via custom controls */
    .control{
      flex:0 0 auto;
      width:20px; height:20px;
      margin-top:2px;
      border:2px solid #4a5f93;
      background: rgba(0,0,0,.15);
      position:relative;
    }
    .control.radio{border-radius:999px;}
    .control.checkbox{border-radius:6px;}

    input[type="radio"], input[type="checkbox"]{
      /* keep input accessible but hidden */
      position:absolute;
      opacity:0;
      pointer-events:none;
    }
    .choice label{
      display:flex; gap:10px; align-items:flex-start; width:100%;
      cursor:pointer;
      position:relative;
    }
    .choice .text{margin-top:1px;}
    .choice:has(input:focus-visible){
      outline: 3px solid rgba(122,162,255,.35);
      outline-offset:2px;
    }
    .choice:has(input:checked){
      border-color:#4f74d6;
      background: rgba(122,162,255,.10);
    }
    /* filled dot for radios */
    .choice:has(input[type="radio"]:checked) .control.radio::after{
      content:"";
      position:absolute; inset:4px;
      border-radius:999px;
      background: var(--accent);
      box-shadow: 0 0 0 3px rgba(122,162,255,.25);
    }
    /* checkmark for checkboxes */
    .choice:has(input[type="checkbox"]:checked) .control.checkbox::after{
      content:"";
      position:absolute;
      left:5px; top:1px;
      width:6px; height:12px;
      border: solid var(--accent);
      border-width: 0 3px 3px 0;
      transform: rotate(45deg);
    }

    .actions{
      margin-top:16px;
      display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:space-between;
    }
    .leftActions, .rightActions{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
    button{
      appearance:none;
      border:1px solid var(--border);
      background: rgba(255,255,255,.03);
      color: var(--text);
      border-radius:12px;
      padding:10px 12px;
      font-weight:600;
      cursor:pointer;
      transition: transform .05s ease, background .15s ease, border-color .15s ease;
    }
    button:hover{border-color:#34508a; background: rgba(122,162,255,.06);}
    button:active{transform: translateY(1px);}
    button.primary{
      border-color:#3a5fc8;
      background: rgba(122,162,255,.16);
    }
    button.danger{
      border-color:#6b2a2a;
      background: rgba(255,107,107,.10);
    }
    button:disabled{
      opacity:.5;
      cursor:not-allowed;
    }
    .revealBox{
      margin-top:14px;
      border:1px dashed #35508a;
      border-radius:12px;
      padding:12px;
      background: rgba(122,162,255,.06);
    }
    .revealTitle{
      font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted);
      margin:0 0 8px 0;
    }
    .revealItem{
      margin:0;
      padding:8px 10px;
      border-radius:10px;
      background: rgba(0,0,0,.18);
      border:1px solid rgba(255,255,255,.06);
      color: var(--text);
      font-size:14px;
    }
    .feedback{
      margin-top:14px;
      border-radius:12px;
      padding:12px;
      border:1px solid var(--border);
      background: rgba(0,0,0,.18);
    }
    .feedback.good{border-color: rgba(57,217,138,.45); background: rgba(57,217,138,.08);}
    .feedback.bad{border-color: rgba(255,107,107,.45); background: rgba(255,107,107,.08);}
    .feedback h3{margin:0 0 6px 0; font-size:14px;}
    .feedback p{margin:0; color:var(--muted); font-size:13px;}
    .kicker{color:var(--muted); font-size:12px; margin-top:2px;}
    footer{margin-top:14px; color:var(--muted); font-size:12px;}
    .sr-only{
      position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden;
      clip:rect(0,0,0,0); white-space:nowrap; border:0;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Fragments Quiz</h1>
        <div class="sub">Numbered questions • consistent radio buttons • progressive reveals (3 levels)</div>
      </div>
      <div class="row">
        <div class="pill"><span>Progress</span> <b id="progressLabel">1 / 8</b></div>
        <div class="pill"><span>Score</span> <b id="scoreLabel">0</b></div>
      </div>
    </header>

    <main class="card" id="app" aria-live="polite"></main>

    <footer>
      Tip: Edit the question text, choices, and “Re-read Fragment …” lines inside the <code>QUESTIONS</code> array.
    </footer>
  </div>

  <script>
    // ====== QUESTIONS (paste-friendly, code-ready) ======
    const QUESTIONS = [
      {
        id: "q1",
        type: "single",
        prompt: "Who was the intended audience?",
        choices: [
          { text: "Delegates of the states in Congress assembled", correct: true },
          { text: "Representatives directly elected by citizens", correct: false },
          { text: "Military leaders coordinating defense", correct: false },
          { text: "Foreign diplomats observing the agreement", correct: false },
          { text: "A single executive authority", correct: false },
        ],
        reveals: [
          "Who is described as having authority to act in this system?",
          "Is power given to individuals, or to political units?",
          "Re-read Fragment E, which explains how Congress is formed and who participates."
        ]
      },
      {
        id: "q2",
        type: "multi",
        prompt: "What problem(s) was this document trying to solve?",
        subtitle: "(Select all that apply)",
        choices: [
          { text: "Lack of unity among states / securing interstate rights", correct: true },
          { text: "Creating a uniform national economy", correct: false },
          { text: "Preventing internal rebellions", correct: false },
          { text: "Avoiding all foreign involvement", correct: false },
          { text: "Enforcing laws within states", correct: false },
        ],
        reveals: [
          "What conflicts might arise if states acted completely independently?",
          "Notice repeated rules about treatment across state lines.",
          "Re-read Fragments A and B, which describe rights and trade between states."
        ]
      },
      {
        id: "q3",
        type: "single",
        prompt: "What powers are clearly granted in this document?",
        choices: [
          { text: "Coordination among states", correct: true },
          { text: "Authority to tax individuals directly", correct: false },
          { text: "Power to enforce laws within states", correct: false },
          { text: "Regulation of internal state commerce", correct: false },
          { text: "Command of a permanent national army", correct: false },
        ],
        reveals: [
          "Focus on what the document explicitly allows—not what it discusses.",
          "Does the text describe enforcement or cooperation?",
          "Re-read Fragments E and F, focusing on what Congress can actually do."
        ]
      },
      {
        id: "q4",
        type: "multi",
        prompt: "What problems does the document seem most concerned with?",
        subtitle: "(Select all that apply)",
        choices: [
          { text: "Lack of unity between states", correct: true },
          { text: "Collective defense", correct: true },
          { text: "Weak central authority", correct: true },
          { text: "Protecting individual civil liberties", correct: false },
          { text: "Promoting economic growth", correct: false },
          { text: "Encouraging popular participation", correct: false },
          { text: "Expanding national territory", correct: false },
        ],
        reveals: [
          "Which concerns appear in more than one fragment?",
          "Which problems require cooperation rather than command?",
          "Re-read Fragments A, B, D, and F and look for repeated themes."
        ]
      },
      {
        id: "q5",
        type: "multi",
        prompt: "Why might humans have created it this way?",
        subtitle: "(Select all that apply)",
        choices: [
          { text: "Preserve state sovereignty while coordinating defense & diplomacy", correct: true },
          { text: "Prefer citizen militias over standing armies", correct: true },
          { text: "Facilitate cross-state movement of people/property without new duties", correct: true },
          { text: "Use supermajority rules to protect minority states on major actions", correct: true },
          { text: "Enable rapid national decision-making", correct: false },
          { text: "Establish a strong centralized executive", correct: false },
          { text: "Centralize economic regulation", correct: false },
          { text: "Encourage national unity through authority", correct: false },
        ],
        reveals: [
          "What does this system make deliberately difficult?",
          "Which rules slow decisions or limit power?",
          "Re-read Fragments D and F (military limits and voting rules)."
        ]
      },
      {
        id: "q6",
        type: "single",
        prompt: "Based on the text alone, what fears or experiences shaped the authors?",
        choices: [
          { text: "Fear of centralized tyranny", correct: true },
          { text: "Distrust of citizen participation", correct: false },
          { text: "Fear of economic competition", correct: false },
          { text: "Desire for long-term political permanence", correct: false },
          { text: "Anxiety over cultural diversity", correct: false },
        ],
        reveals: [
          "What type of power is most restricted in this document?",
          "Why might concentrated authority be treated cautiously?",
          "Re-read Fragments D and E, especially limits on military and enforcement power."
        ]
      },
      {
        id: "q7",
        type: "single",
        prompt: "What does this document reveal these beings fear most?",
        choices: [
          { text: "Fragmentation and disunity", correct: true },
          { text: "Too much popular participation", correct: false },
          { text: "Economic stagnation", correct: false },
          { text: "Foreign cultural influence", correct: false },
          { text: "Regional inequality", correct: false },
        ],
        reveals: [
          "What outcome would make this agreement unnecessary?",
          "Why repeat rules about cooperation across states?",
          "Re-read Fragments A, B, and F, noting unity language."
        ]
      },
      {
        id: "q8",
        type: "single",
        prompt: "Based on the rules in this document, what major problem is most likely to emerge over time?",
        choices: [
          { text: "The national government will struggle to act quickly or decisively", correct: true },
          { text: "States will lose their independence to the central government", correct: false },
          { text: "Citizens will gain too much direct political power", correct: false },
          { text: "The military will become too powerful and dominate politics", correct: false },
          { text: "Economic growth will be tightly controlled by Congress", correct: false },
        ],
        reveals: [
          "What does this system make deliberately difficult to do?",
          "Look for rules that require large agreement before major action can happen.",
          "Re-read Fragments F (voting thresholds) and E (structure of Congress) and consider what happens when states disagree."
        ],
        notes:
          "Wrong answers are tempting because they project later Constitution-era fears backward, confuse limits on power with expansion of power, and assume outcomes not supported by enforcement rules."
      }
    ];

    // ====== APP STATE ======
    let idx = 0;
    let score = 0;
    const answered = new Array(QUESTIONS.length).fill(false);
    const revealCountByQ = new Array(QUESTIONS.length).fill(0); // 0..3
    const userAnswers = new Array(QUESTIONS.length).fill(null); // Set() for multi, string index for single

    // ====== HELPERS ======
    const el = (tag, attrs = {}, ...children) => {
      const node = document.createElement(tag);
      for (const [k,v] of Object.entries(attrs)) {
        if (k === "class") node.className = v;
        else if (k === "html") node.innerHTML = v;
        else if (k.startsWith("on") && typeof v === "function") node.addEventListener(k.slice(2), v);
        else node.setAttribute(k, v);
      }
      for (const c of children) {
        if (c == null) continue;
        node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
      }
      return node;
    };

    function updateTopBar(){
      document.getElementById("progressLabel").textContent = `${idx+1} / ${QUESTIONS.length}`;
      document.getElementById("scoreLabel").textContent = `${score}`;
    }

    function getCorrectSet(q){
      const s = new Set();
      q.choices.forEach((c,i)=>{ if (c.correct) s.add(String(i)); });
      return s;
    }

    function setsEqual(a,b){
      if (a.size !== b.size) return false;
      for (const x of a) if (!b.has(x)) return false;
      return true;
    }

    function currentSelection(q){
      const name = q.id;
      if (q.type === "single") {
        const checked = document.querySelector(`input[name="${name}"]:checked`);
        return checked ? checked.value : null;
      } else {
        const checks = document.querySelectorAll(`input[name="${name}"]:checked`);
        const s = new Set();
        checks.forEach(n => s.add(n.value));
        return s;
      }
    }

    function render(){
      updateTopBar();
      const app = document.getElementById("app");
      app.innerHTML = "";

      const q = QUESTIONS[idx];

      // Header
      const qHeadLeft = el("div", {},
        el("div", { class: "qnum" }, `Question ${idx+1}`),
        el("div", { class: "prompt" }, q.prompt),
        q.subtitle ? el("div", { class: "hintline" }, q.subtitle) : null
      );

      const qHeadRight = el("div", { class: "row" },
        el("div", { class: "pill" }, "Type: ", el("b", {}, q.type === "multi" ? "Select all" : "Single choice"))
      );

      app.appendChild(el("div", { class: "qhead" }, qHeadLeft, qHeadRight));

      // Choices
      const choices = el("div", { class: "choices" });
      const inputType = q.type === "multi" ? "checkbox" : "radio";

      q.choices.forEach((c,i)=>{
        const value = String(i);
        const inputId = `${q.id}_${i}`;

        // input
        const input = el("input", { type: inputType, name: q.id, id: inputId, value });

        // restore previous selection
        const prev = userAnswers[idx];
        if (q.type === "single" && typeof prev === "string" && prev === value) input.checked = true;
        if (q.type === "multi" && prev instanceof Set && prev.has(value)) input.checked = true;

        // custom control
        const control = el("span", { class: `control ${inputType === "radio" ? "radio" : "checkbox"}`, "aria-hidden": "true" });

        const label = el("label", { for: inputId },
          control,
          input,
          el("div", { class: "text" }, c.text)
        );

        choices.appendChild(el("div", { class: "choice" }, label));
      });

      app.appendChild(choices);

      // Reveals (progressive)
      const revealShown = revealCountByQ[idx];
      if (revealShown > 0){
        const box = el("div", { class: "revealBox" },
          el("div", { class: "revealTitle" }, "Progressive reveals")
        );
        for (let r = 0; r < revealShown; r++){
          box.appendChild(el("p", { class: "revealItem" }, `Reveal ${r+1}: ${q.reveals[r]}`));
        }
        app.appendChild(box);
      }

      // Feedback (after answering)
      if (answered[idx]) {
        const correctSet = getCorrectSet(q);
        const ua = userAnswers[idx];

        let isCorrect = false;
        if (q.type === "single") isCorrect = (typeof ua === "string") && correctSet.has(ua) && correctSet.size === 1;
        else isCorrect = (ua instanceof Set) && setsEqual(ua, correctSet);

        const fb = el("div", { class: `feedback ${isCorrect ? "good" : "bad"}` },
          el("h3", {}, isCorrect ? "✅ Correct" : "❌ Not quite"),
        );

        if (!isCorrect) {
          // show correct answer(s)
          const correctTexts = [];
          q.choices.forEach((c,i)=>{ if (c.correct) correctTexts.push(c.text); });
          fb.appendChild(el("p", {}, `Correct answer${correctTexts.length>1 ? "s" : ""}: `, correctTexts.join(" • ")));
        } else {
          fb.appendChild(el("p", {}, "Nice — your selection matches the key."));
        }

        if (q.notes) {
          fb.appendChild(el("div", { class: "kicker" }, q.notes));
        }

        app.appendChild(fb);
      }

      // Actions
      const submitBtn = el("button", {
        class: "primary",
        onClick: () => onSubmit()
      }, answered[idx] ? "Answered" : "Submit");

      submitBtn.disabled = answered[idx];

      const revealBtn = el("button", {
        onClick: () => onReveal()
      }, revealCountByQ[idx] >= 3 ? "All reveals shown" : "Reveal next clue");

      revealBtn.disabled = revealCountByQ[idx] >= 3;

      const prevBtn = el("button", {
        onClick: () => { idx = Math.max(0, idx-1); render(); }
      }, "← Previous");

      prevBtn.disabled = idx === 0;

      const nextBtn = el("button", {
        onClick: () => { idx = Math.min(QUESTIONS.length-1, idx+1); render(); }
      }, "Next →");

      // lock "Next" until answered, except allow review if later questions already reached
      nextBtn.disabled = (idx < QUESTIONS.length - 1) && !answered[idx];

      const resetBtn = el("button", { class:"danger", onClick: () => onReset() }, "Reset quiz");

      const leftActions = el("div", { class:"leftActions" }, prevBtn, nextBtn);
      const rightActions = el("div", { class:"rightActions" }, revealBtn, submitBtn, resetBtn);

      app.appendChild(el("div", { class:"actions" }, leftActions, rightActions));

      // Persist selection as user clicks (so navigation doesn't lose it)
      app.querySelectorAll(`input[name="${q.id}"]`).forEach(inp=>{
        inp.addEventListener("change", () => {
          const sel = currentSelection(q);
          userAnswers[idx] = sel;
        });
      });
    }

    function onReveal(){
      const q = QUESTIONS[idx];
      const cur = revealCountByQ[idx];
      revealCountByQ[idx] = Math.min(3, cur + 1);
      render();
    }

    function onSubmit(){
      const q = QUESTIONS[idx];
      const sel = currentSelection(q);

      // Require a selection before submitting
      if (q.type === "single" && sel === null) {
        alert("Choose an answer before submitting.");
        return;
      }
      if (q.type === "multi" && (sel == null || sel.size === 0)) {
        alert("Choose at least one option before submitting.");
        return;
      }

      userAnswers[idx] = sel;

      const correctSet = getCorrectSet(q);
      let isCorrect = false;

      if (q.type === "single") {
        isCorrect = correctSet.has(sel) && correctSet.size === 1;
      } else {
        isCorrect = setsEqual(sel, correctSet);
      }

      if (!answered[idx]) {
        answered[idx] = true;
        if (isCorrect) score += 1;
      }

      // auto-advance if correct (optional); keeping gentle: advance on any submit if not last
      if (idx < QUESTIONS.length - 1) {
        idx += 1;
      }
      render();
    }

    function onReset(){
      idx = 0;
      score = 0;
      for (let i=0; i<answered.length; i++) answered[i] = false;
      for (let i=0; i<revealCountByQ.length; i++) revealCountByQ[i] = 0;
      for (let i=0; i<userAnswers.length; i++) userAnswers[i] = null;
      render();
    }

    // boot
    render();
  </script>
</body>
</html>
